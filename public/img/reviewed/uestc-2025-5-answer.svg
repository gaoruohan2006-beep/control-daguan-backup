    <marker id="negative" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#9a526c"/></marker>
    <marker id="arc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#677586"/></marker>
  </defs>
  <rect width="660" height="342" fill="#ffffff"/>
