name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright (uses the runner's Google Chrome)
        run: pip install playwright
      - name: Build precache list
        run: python3 tools/build_precache.py
      - name: Verify reviewed bank in Chromium
        env:
          BANK_SCREENSHOT: shots/reviewed-bank.png
        run: |
          mkdir -p shots
          python3 -m http.server 8765 -d public > /tmp/http.log 2>&1 &
          sleep 1
          python3 tools/verify_reviewed_bank.py http://localhost:8765/
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-shots
          path: shots/
          if-no-files-found: ignore
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check data files
        run: |
          python3 -c "import json;d=json.load(open('public/data/library.json'));print(len(d['questions']),'questions')"
          python3 tools/build_precache.py
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
